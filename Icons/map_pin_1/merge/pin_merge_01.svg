<svg width="200" height="250" viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3B30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B00020;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowBottom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <path d="M10,15 Q50,5 90,15 Q100,40 95,65 Q75,80 50,120 Q25,80 5,65 Q0,40 10,15 Z" 
        fill="url(#mainGradient)" filter="url(#shadowBottom)"/>
  <!-- Mark 01 -->
  <g id="mark_01" transform="translate(0, 10)">
<!-- Arrow Design Refined - Centered at Y=32 -->
  <g transform="translate(50, 32) scale(0.8) translate(-50, -40)">
    <!-- Movement Path (Thick Curved Line) -->
    <path d="M20,65 
             C35,65 45,35 60,35 
             C70,35 80,25 80,25" 
          fill="none" stroke="white" stroke-width="10" stroke-linecap="round" />
    
    <!-- Start Point A: Extra Large White Circle (r=13) -->
    <circle cx="20" cy="65" r="13" fill="white" />
    
    <!-- Start Point Center: Red Dot (r=10) - User Request -->
    <circle cx="20" cy="65" r="10" fill="#FF3B30" />
    
    <!-- End Point B: Extra Large Arrow Head -->
    <path d="M65,5 L105,25 L75,55 Z" fill="white" />
  </g>
  </g>
</svg>