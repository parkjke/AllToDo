<svg width="200" height="250" viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3B30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B00020;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowBottom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <path d="M10,15 Q50,5 90,15 Q100,40 95,65 Q75,80 50,120 Q25,80 5,65 Q0,40 10,15 Z" 
        fill="url(#mainGradient)" filter="url(#shadowBottom)"/>
  <!-- Mark 01 -->
  <g id="mark_01">
<!-- Wanderer Path (2 Turns, Dashed) - Shifted up by 5 units -->
  <path d="M50,70 Q85,70 50,50 Q15,50 50,30" 
        fill="none" 
        stroke="white" 
        stroke-width="3" 
        stroke-dasharray="0.1 6" 
        stroke-linecap="round" />

  <!-- Starting Point: Red Solid Dot with White Border - Shifted up by 5 units -->
  <circle cx="50" cy="70" r="4.5" fill="#FF3B30" stroke="white" stroke-width="1.5" />

  <!-- Current Point: Large White Solid Dot (No border) - Shifted up by 5 units -->
  <circle cx="50" cy="30" r="9" fill="white" />
  </g>
</svg>