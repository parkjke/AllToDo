<svg width="200" height="250" viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3B30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B00020;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowBottom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Shield Background -->
  <path d="M10,15 Q50,5 90,15 Q100,40 95,65 Q75,80 50,120 Q25,80 5,65 Q0,40 10,15 Z" 
        fill="url(#mainGradient)" filter="url(#shadowBottom)"/>

  <!-- Mark: Bare Feet -->
  <!-- Adjusted to center within the shield body -->
  <g transform="translate(0, 10) scale(0.9) translate(5, 0)"> 
      <!-- Base Halo/Shadow for context -->
      <ellipse cx="50" cy="55" rx="30" ry="10" fill="#000000" fill-opacity="0.2"/>
    
      <!-- Left Foot (Deep Arch) -->
      <g transform="translate(35, 30) rotate(-15)">
        <path d="M4,4 C-1,4 -6,10 -6,16 C-6,21 -2,22 1,24 C-1,26 -4,29 -4,34 C-4,38 -1,40 3,40 C7,40 10,38 10,34 C10,29 7,26 6,24 C8,22 10,18 10,14 C10,8 8,4 4,4 Z" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="-4" cy="2" rx="2.2" ry="3" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="-0.5" cy="-0.5" rx="1.8" ry="2.4" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="2.5" cy="0.5" rx="1.6" ry="2.2" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="5" cy="1.5" rx="1.4" ry="2" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="7.5" cy="3" rx="1.2" ry="1.8" fill="white" stroke="#333333" stroke-width="1"/>
      </g>
    
      <!-- Right Foot (Deep Arch) -->
      <g transform="translate(65, 20) rotate(15)">
        <path d="M4,4 C-1,4 -6,10 -6,16 C-6,21 -2,22 1,24 C-1,26 -4,29 -4,34 C-4,38 -1,40 3,40 C7,40 10,38 10,34 C10,29 7,26 6,24 C8,22 10,18 10,14 C10,8 8,4 4,4 Z" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="-4" cy="2" rx="2.2" ry="3" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="-0.5" cy="-0.5" rx="1.8" ry="2.4" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="2.5" cy="0.5" rx="1.6" ry="2.2" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="5" cy="1.5" rx="1.4" ry="2" fill="white" stroke="#333333" stroke-width="1"/>
        <ellipse cx="7.5" cy="3" rx="1.2" ry="1.8" fill="white" stroke="#333333" stroke-width="1"/>
      </g>
  </g>
</svg>
