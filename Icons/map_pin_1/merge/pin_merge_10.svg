<!-- Checkbox Frame -->
  <rect x="25" y="32" width="34" height="34" rx="4" ry="4" fill="none" stroke="white" stroke-width="3" />
  
  <!-- "Edgy" Translucent Check Mark (Shortened tail, more space from shield) -->
