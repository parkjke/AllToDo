<svg width="100" height="90" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
  <!-- Pin 25: "Exploded Bomb" / "Cancel" Symbol -->
  <!-- Red Fill with Orange Core -->
  
  <g transform="translate(50, 50) scale(1.0)">
    <!-- Outer Explosion (Red) -->
    <!-- Gray 3 Stroke maintained for consistency -->
    <path d="M 0,-30 
             L 10,-15 L 25,-25 
             L 20,-5 L 35,5 
             L 15,15 L 20,30 
             L 0,20 
             L -20,30 L -15,15 
             L -35,5 L -20,-5 
             L -25,-25 L -10,-15 Z" 
          fill="#FF3B30" stroke="#C7C7CC" stroke-width="2.5" stroke-linejoin="round" />
          
    <!-- Inner Explosion / Core (Orange) -->
    <!-- Scaled down 0.5 -->
    <g transform="scale(0.5)">
      <path d="M 0,-30 
               L 10,-15 L 25,-25 
               L 20,-5 L 35,5 
               L 15,15 L 20,30 
               L 0,20 
               L -20,30 L -15,15 
               L -35,5 L -20,-5 
               L -25,-25 L -10,-15 Z" 
            fill="#FF9500" stroke="none" />
    </g>
  </g>
</svg>
