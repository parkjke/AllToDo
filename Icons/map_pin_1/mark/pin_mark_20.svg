<svg width="100" height="90" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
  <!-- Refined Aesthetic Question Mark -->
  <!-- Moved down to 54 -->
  <!-- Scale 1.8 -->
  <!-- Thinner Line (2.5) with Gray 3 Border (4.5) -->
  <g transform="translate(50, 54) scale(1.8)">
    
    <!-- Hook Border (Gray 3) -->
    <path d="M-6,-10 C-6,-17 6,-17 6,-10 C6,-6 1,-4.5 0,-0.5" 
          fill="none" stroke="#C7C7CC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Hook Main (White) - Thinner -->
    <path d="M-6,-10 C-6,-17 6,-17 6,-10 C6,-6 1,-4.5 0,-0.5" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dot: White Fill, Gray Stroke -->
    <circle cx="0" cy="7.5" r="3.0" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1.5" />
  </g>
</svg>
