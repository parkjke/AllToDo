<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="100" height="125" viewBox="0 0 100 125" preserveAspectRatio="xMidYMid meet">
  <!-- 02 Mark: Identical to 01 but Green Dot & shifted Down-Left -->
  <!-- Shifted X: 47 (Left 3), Y: 39 (Down 7 from center 32) -->
  <g transform="translate(47, 39) scale(0.8) translate(-50, -40)">
    <!-- Movement Path (Thick Curved Line) -->
    <path d="M20,65 
             C35,65 45,35 60,35 
             C70,35 80,25 80,25" 
          fill="none" stroke="white" stroke-width="10" stroke-linecap="round" />
    
    <!-- Start Point A: Extra Large White Circle (r=13) -->
    <circle cx="20" cy="65" r="13" fill="white" />
    
    <!-- Start Point Center: Green Dot (r=10) - User Request -->
    <circle cx="20" cy="65" r="10" fill="#2FB344" />
    
    <!-- End Point B: Extra Large Arrow Head -->
    <path d="M65,5 L105,25 L75,55 Z" fill="white" />
  </g>
</svg>
