<svg width="100" height="90" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
  <!-- Green Check with White Border -->
  <!-- Center (50, 42) kept, scale 1.8 -->
  <!-- Layering: White Stroke (Width 10) behind Green Stroke (Width 6) -->
  <g transform="translate(50, 42) scale(1.8)">
    <!-- White Border (Background) -->
    <path d="M-10,0 L-3,7 L10,-6" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Green Inner -->
    <path d="M-10,0 L-3,7 L10,-6" 
          fill="none" 
          stroke="#2FB344" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
