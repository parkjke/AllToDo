<svg width="100" height="90" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
  <!-- Red X with White Border -->
  <!-- Moved down (42 -> 48) -->
  <!-- Layering: White Stroke (Width 10) behind Red Stroke (Width 6) -->
  <g transform="translate(50, 48) scale(1.8)">
    <!-- White Border (Background) -->
    <path d="M-10,-10 L10,10 M10,-10 L-10,10" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" />
    <!-- Red Inner -->
    <path d="M-10,-10 L10,10 M10,-10 L-10,10" 
          fill="none" 
          stroke="#FF3B30" 
          stroke-width="6" 
          stroke-linecap="round" />
  </g>
</svg>
