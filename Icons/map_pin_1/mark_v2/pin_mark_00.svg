<svg width="200" height="250" viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg">
  <!-- v5.1 Custom Arrow + Tilted Hub (Blue/SkyBlue) -->

  <!-- Tilted Accuracy Halo (Translucent Sky Blue) -->
  <path d="M50,90m-22,0a22,8 0,1 1,44 0a22,8 0,1 1,-44 0" fill="#5AC8FA40" stroke="#5AC8FA" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Tilted Location Dot (Blue Fill, Sky Blue Border) -->
  <!-- Outer Border (Sky Blue) -->
  <ellipse cx="50" cy="90" rx="14" ry="6" fill="#007AFF" stroke="#5AC8FA" stroke-width="2"/>
  
  <!-- Inner Highlight for 3D effect (Subtle) -->
  <ellipse cx="50" cy="89" rx="8" ry="3" fill="#FFFFFF" opacity="0.2"/>

  <!-- Custom Round Arrow (Floating) -->
  <!-- Based on the "soft" arrow image provided -->
  <g transform="translate(50, 50)">
      <!-- Arrow Head (Rounded triangle) -->
      <path d="M0 25 L-12 8 Q-15 4 -10 4 L10 4 Q15 4 12 8 L0 25 Z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      <!-- Arrow Shaft (Thick, Rounded top) -->
      <path d="M-6 4 L-6 -20 Q-6 -25 0 -25 Q6 -25 6 -20 L6 4 Z" fill="white"/>
  </g>
  
  <!-- Shadow on the ground -->
  <ellipse cx="50" cy="90" rx="4" ry="1.5" fill="black" opacity="0.2"/>
</svg>
